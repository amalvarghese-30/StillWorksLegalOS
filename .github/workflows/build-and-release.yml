name: Build & Release Desktop EXE

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verify release build without publishing release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & Publish Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Validate Release Version & Prohibit Duplicates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          node scripts/validate-release-version.cjs

      - name: Run Release Verification Suite
        run: |
          node scripts/release-verify.cjs

      - name: Build Windows EXE Installer Package
        run: |
          npx electron-builder --config electron-builder.json --win --publish never

      - name: Verify Release Artifacts & Updater Metadata
        run: |
          node scripts/validate-release-version.cjs --check-artifacts

      - name: Publish Safe GitHub Release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $version = $pkg.version
          $tag = "v$version"
          $assets = (Get-ChildItem release -File | Where-Object { $_.Name -like "ss-legaltech*" -or $_.Name -eq "latest.yml" }).FullName
          gh release create $tag $assets --title "$tag" --notes "StillWorks LegalOS $tag"
