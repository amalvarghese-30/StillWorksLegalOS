name: Build & Release Desktop EXE

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Verify release build without publishing release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & Publish Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Determine & Bump Version for Auto-Update
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_AUTO_BUMP: 'true'
        run: |
          node scripts/check-and-bump-version.cjs --allow-auto-bump

      - name: Validate Release Version & Prohibit Duplicates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          node scripts/validate-release-version.cjs

      - name: Run Release Verification Suite
        run: |
          node scripts/release-verify.cjs

      - name: Build Windows EXE Installer Package
        run: |
          npx electron-builder --config electron-builder.json --win --publish never

      - name: Verify Release Artifacts & Updater Metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          node scripts/validate-release-version.cjs --check-artifacts

      - name: Publish Safe GitHub Release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if ("${{ steps.versioning.outputs.is_bumped }}" -eq "true") {
            git add package.json
            git commit -m "chore(release): bump desktop version to ${{ steps.versioning.outputs.version }} [skip ci]"
            git push origin main
          }
          $tag = "v${{ steps.versioning.outputs.version }}"
          git tag -f "$tag"
          git push origin "$tag" --force
          $assets = (Get-ChildItem release -File | Where-Object { $_.Name -like "ss-legaltech*" -or $_.Name -eq "latest.yml" }).FullName
          gh release delete "$tag" --yes 2>$null || $true
          gh release create "$tag" $assets --title "$tag" --notes "StillWorks LegalOS $tag"
