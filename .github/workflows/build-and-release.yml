name: Build & Release Desktop EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build & Publish Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Determine & Bump Version for Auto-Update
        id: versioning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/check-and-bump-version.cjs

      - name: Build Web Client & Electron Preload
        run: |
          npm run build:client

      - name: Build Windows EXE Installer Package
        run: |
          npx electron-builder --config electron-builder.json --win --publish never

      - name: Publish Unified GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if ("${{ steps.versioning.outputs.is_bumped }}" -eq "true") {
            git add package.json
            git commit -m "chore(release): bump desktop version to ${{ steps.versioning.outputs.version }} [skip ci]"
            git push origin main
          }
          git tag -f "v${{ steps.versioning.outputs.version }}"
          git push origin "v${{ steps.versioning.outputs.version }}" --force
          $assets = (Get-ChildItem release -File | Where-Object { $_.Name -like "ss-legaltech*" -or $_.Name -eq "latest.yml" }).FullName
          gh release delete "v${{ steps.versioning.outputs.version }}" --yes 2>$null || $true
          gh release create "v${{ steps.versioning.outputs.version }}" $assets --title "${{ steps.versioning.outputs.version }}" --notes "Automated release of StillWorks LegalOS v${{ steps.versioning.outputs.version }}"
