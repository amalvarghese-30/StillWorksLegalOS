name: One-time merged branch cleanup
# Temporary one-run workflow; remove this file after successful cleanup.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-branch-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch contents and delete obsolete branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          branches=(
            "feature/hearing-history-sync-and-day-details-fix"
            "fix/auth-refresh-and-socket-connection"
            "fix/calendar-day-events-timezone-sync"
            "fix/forensic-audit-data-integrity"
            "fix/hearing-sync-reliability"
            "fix/release-validation-hardening"
            "fix/safe-audit-remediation"
          )

          # Validate every branch before deleting any branch.
          for branch in "${branches[@]}"; do
            ref="refs/remotes/origin/$branch"
            if ! git show-ref --verify --quiet "$ref"; then
              echo "Branch already absent; nothing to validate: $branch"
              continue
            fi

            if git merge-base --is-ancestor "$ref" origin/main; then
              echo "Verified merged/ancestor branch: $branch"
              continue
            fi

            # PR #5's branch diverged, but its two production source files were
            # confirmed byte-identical to main, and its S38-71..S38-90 regression
            # assertions are present in main. Verify that invariant before deletion.
            if [[ "$branch" == "fix/hearing-sync-reliability" ]]; then
              for file in server/src/routes/calendar.ts server/src/routes/cases.ts; do
                if ! diff -q <(git show "origin/main:$file") <(git show "$ref:$file") >/dev/null; then
                  echo "::error::Refusing to delete $branch: $file differs from main."
                  exit 1
                fi
              done

              main_tests="$(git show origin/main:server/src/tests/run-tests.ts)"
              for number in $(seq 71 90); do
                if ! grep -Fq "\"S38-$number: " <<<"$main_tests"; then
                  echo "::error::Refusing to delete $branch: missing S38-$number regression test on main."
                  exit 1
                fi
              done
              echo "Verified hearing-sync implementation and regression tests are included on main: $branch"
              continue
            fi

            echo "::error::Refusing to delete branch with unmerged/unverified content: $branch"
            exit 1
          done

          # Only after all branches pass validation, delete the allowlisted refs.
          for branch in "${branches[@]}"; do
            ref="refs/remotes/origin/$branch"
            if git show-ref --verify --quiet "$ref"; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$branch" >/dev/null
              echo "Deleted obsolete branch: $branch"
            fi
          done
